name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The UI is a separate package with its own lockfile.
      - name: Install UI dependencies
        run: npm ci --prefix ui

      # GP-2 drives the real UI in Chromium. CI is the one place where the
      # browser is downloaded (release.yml does the same). Without it GP-2 fails,
      # and before v0.3.1 that failure also left the whole test run hanging.
      - name: Install Chromium for the UI end-to-end test
        run: node node_modules/playwright-core/cli.js install chromium

      # Advisory, not blocking: the core runs on --experimental-strip-types
      # and carries pre-existing strict-tsc findings in src/ that REL-01 is
      # not allowed to touch. The gate makes the debt visible; the load-check
      # below plus the test suite remain the blocking core checks.
      - name: Typecheck core (advisory)
        continue-on-error: true
        run: npm run typecheck

      - name: Load-check core (runs the whole CLI module graph against a temp home)
        shell: bash
        run: PLUGBRAIN_HOME="${{ runner.temp }}/pb-ci-home" PLUGBRAIN_NO_DAEMON=1 node --experimental-strip-types --no-warnings src/cli.ts status

      - name: Typecheck UI
        run: npm --prefix ui run typecheck

      - name: Run tests
        run: npm test

      - name: Secret scan
        run: npm run secret:scan
