name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Load-check core (runs the whole CLI module graph against a temp home)
        shell: bash
        run: PLUGBRAIN_HOME="${{ runner.temp }}/pb-ci-home" PLUGBRAIN_NO_DAEMON=1 node --experimental-strip-types --no-warnings src/cli.ts status

      - name: Typecheck UI
        run: npm --prefix ui run typecheck

      - name: Run tests
        run: npm test

      - name: Secret scan
        run: npm run secret:scan
